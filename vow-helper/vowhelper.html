<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script src="code.js">
        document.getElementById("check1").addEventListener("click", function() {checkSymbol(1)});
        document.getElementById("check2").addEventListener("click", function() {checkSymbol(2)});
        document.getElementById("check3").addEventListener("click", function() {checkSymbol(3)});
    </script>
    <script src="https://kit.fontawesome.com/81872141fe.js" crossorigin="anonymous"></script>
    <title>Vow Symbol Helper</title>
</head>
<body>
    
    <div id="return-button"><a href="../index.html"><i class="fa-solid fa-person-walking-arrow-loop-left"></i></a></div>
    <div class="selection container current">
        <div class="pillar">
            <div id="pillar-symbol-1"></div>
            <div id="pillar-symbol-2"></div>
            <div id="pillar-symbol-3"></div>
        </div>
        <div class="symbol-container">
            <div class="symbol pyramid" onclick="setSymbol('pyramid')"></div>
            <div class="symbol give" onclick="setSymbol('give')"></div>
            <div class="symbol darkness" onclick="setSymbol('darkness')"></div>
            <div class="symbol traveler" onclick="setSymbol('traveler')"></div>
            <div class="symbol worship" onclick="setSymbol('worship')"></div>
            <div class="symbol light" onclick="setSymbol('light')"></div>
            <div class="symbol stop" onclick="setSymbol('stop')"></div>
            <div class="symbol guardian" onclick="setSymbol('guardian')"></div>
            <div class="symbol kill" onclick="setSymbol('kill')"></div>
        </div>
    </div>
    <div class="info container after">
        <div class="info-1">
            <div class="image"></div>
            <div class="info-wrapper">
                <div class="title" onclick="checkSymbol(1);">
                    <h3></h3>
                    <button class="checkbox" id="check1""><h4>Done!</h4></button>
                </div>
                <div class="desc">
                    <span></span>
                    <i class="fa-sharp fa-solid fa-images image-icon"></i>
                    <div class="image-wrapper" id="images-1">
                        <div class="move-button left" onclick="leftShiftImages(1)"><i class="fa-solid fa-angles-left"></i></div>
                        <div class="image-box" id="image-box-1">
                        </div>
                        <div class="move-button right" onclick="rightShiftImages(1)"><i class="fa-solid fa-angles-right"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="info-2">
            <div class="image"></div>
            <div class="info-wrapper">
                <div class="title" onclick="checkSymbol(2)">
                    <h3></h3>
                    <button class="checkbox" id="check2"><h4>Done!</h4></button>
                </div>
                <div class="desc">
                    <span></span>
                    <i class="fa-sharp fa-solid fa-images image-icon"></i>
                    <div class="image-wrapper" id="images-2">
                        <div class="move-button left" onclick="leftShiftImages(2)"><i class="fa-solid fa-angles-left"></i></div>
                        <div class="image-box" id="image-box-2">
                        </div>
                        <div class="move-button right" onclick="rightShiftImages(2)"><i class="fa-solid fa-angles-right"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="info-3">
            <div class="image"></div>
            <div class="info-wrapper">
                <div class="title" onclick="checkSymbol(3)">
                    <h3></h3>
                    <button class="checkbox" id="check3"><h4>Done!</h4></button>
                </div>
                <div class="desc">
                    <span></span>
                    <i class="fa-sharp fa-solid fa-images image-icon"></i>
                    <div class="image-wrapper" id="images-3">
                        <div class="move-button left" onclick="leftShiftImages(3)"><i class="fa-solid fa-angles-left"></i></div>
                        <div class="image-box" id="image-box-3">
                        </div>
                        <div class="move-button right" onclick="rightShiftImages(3)"><i class="fa-solid fa-angles-right"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="step-selector">
        <div class="step disabled" id="step1" onclick="showSymbolSelection()"></div>
        <div class="step" id="step2" onclick="showInfo()"></div>
    </div>
    <button class="button disabled" id="next" onclick="showInfo()">Next</button>
    <button class="button disabled" id="reset" onclick="reset()">Reset</button>

</body>
</html>
